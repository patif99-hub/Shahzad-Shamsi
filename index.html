<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoLedger Pro — Car Management Portal</title>

  <!-- ✅ Load Chart.js ONCE globally -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root{
      --brand:#27255f;
      --brand2:#38357a;
      --bg:#f4f6fb;
      --card:#ffffff;
      --muted:#6b7280;
      --line:#e5e7eb;
      --shadow:0 12px 28px rgba(0,0,0,.10);
      --shadow2:0 6px 16px rgba(0,0,0,.08);
      --radius:14px;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: Arial, sans-serif;
      background: radial-gradient(1200px 800px at 20% 0%, #eef0ff 0%, var(--bg) 45%, #f7f8ff 100%);
      color:#111827;
    }

    /* ====== Subtle background blobs ====== */
    .bg-blobs{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:-1;
      overflow:hidden;
    }
    .blob{
      position:absolute;
      width:420px;height:420px;
      border-radius:50%;
      filter: blur(42px);
      opacity:.18;
      animation: floaty 10s ease-in-out infinite;
    }
    .blob.b1{ left:-120px; top:-140px; background: var(--brand); }
    .blob.b2{ right:-140px; top:120px; background: #0f766e; animation-delay: -2s; }
    .blob.b3{ left:35%; bottom:-220px; background: #f59e0b; animation-delay: -4s; }
    @keyframes floaty{
      0%,100%{ transform: translate3d(0,0,0) scale(1); }
      50%{ transform: translate3d(0,18px,0) scale(1.03); }
    }

    /* ====== Sidebar ====== */
    .sidebar{
      position:fixed;
      left:0;
      top:0;
      bottom:0;
      width:240px;
      padding:18px 14px;
      background: linear-gradient(180deg, var(--brand), var(--brand2));
      color:#fff;
      box-shadow: 4px 0 18px rgba(0,0,0,0.14);
      display:flex;
      flex-direction:column;
      gap:14px;
      z-index:5;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 10px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.10);
      position:relative;
      overflow:hidden;
    }
    .brand:before{
      content:"";
      position:absolute;
      inset:-50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.18), transparent 55%);
      transform: rotate(15deg);
    }

    .logo{
      width:42px;height:42px;
      border-radius:12px;
      background: rgba(255,255,255,0.12);
      border:1px solid rgba(255,255,255,0.18);
      display:grid;
      place-items:center;
      flex:0 0 auto;
      box-shadow: 0 10px 18px rgba(0,0,0,.16);
      position:relative;
      z-index:1;
    }
    .logo svg{ width:26px;height:26px; opacity:.95; }

    .brand-txt{
      position:relative;
      z-index:1;
      line-height:1.1;
    }
    .brand-txt .name{
      font-weight:900;
      font-size:15px;
      letter-spacing:.3px;
    }
    .brand-txt .tag{
      font-size:12px;
      opacity:.85;
      font-weight:800;
      margin-top:3px;
    }

    .nav{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    /* ✅ Sidebar button size fixed */
    .nav-btn{
      width:100%;
      display:flex;
      align-items:center;
      gap:8px;
      text-align:left;
      padding:8px 10px;
      border-radius:10px;
      background: rgba(255,255,255,0.08);
      color:#fff;
      border:1px solid rgba(255,255,255,0.10);
      cursor:pointer;
      font-weight:800;
      font-size:13px;
      line-height:1;
      transition: transform .16s ease, background .16s ease, box-shadow .16s ease;
      position:relative;
      overflow:hidden;
    }

    .nav-btn:after{
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(90deg, rgba(255,255,255,0.18), transparent 55%);
      transform: translateX(-110%);
      transition: transform .25s ease;
    }

    .nav-btn:hover{
      background: rgba(255,255,255,0.12);
      transform: translateX(3px);
      box-shadow: 0 10px 22px rgba(0,0,0,.14);
    }
    .nav-btn:hover:after{ transform: translateX(0%); }

    .nav-btn.active{
      background:#ffffff;
      color: var(--brand);
      border-color: rgba(255,255,255,0.25);
      box-shadow: 0 12px 26px rgba(0,0,0,.16);
    }

    .nav-btn .ic{
      width:26px;height:26px;
      border-radius:9px;
      display:grid;
      place-items:center;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.12);
      flex:0 0 auto;
      font-size:14px;
    }
    .nav-btn.active .ic{
      background: rgba(39,37,95,0.12);
      border-color: rgba(39,37,95,0.18);
    }

    .sidebar .footer{
      margin-top:auto;
      padding:10px 10px 0;
      font-size:12px;
      color:rgba(255,255,255,0.85);
    }
    .footer .chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:7px 10px;
      border-radius:999px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.14);
      font-weight:800;
    }

    /* ====== Main ====== */
    .main{
      margin-left:260px;
      padding:22px;
      min-height:100vh;
    }

    /* Top bar */
    .topbar{
      max-width:1240px;
      margin:0 auto 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .topbar .crumb{
      font-weight:900;
      color:#111827;
      font-size:14px;
      opacity:.9;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .crumb .dot{
      width:8px;height:8px;border-radius:99px;background: #10b981;
      box-shadow: 0 0 0 4px rgba(16,185,129,.12);
    }

    .topbar .actions{
      display:flex;
      gap:10px;
    }
    .pill{
      border:1px solid var(--line);
      background:#fff;
      border-radius:999px;
      padding:9px 12px;
      box-shadow: var(--shadow2);
      font-weight:900;
      color:#111827;
      cursor:pointer;
      transition: transform .16s ease, box-shadow .16s ease;
      user-select:none;
    }
    .pill:hover{ transform: translateY(-1px); box-shadow: var(--shadow); }

    /* Loaded content styling */
    #content{
      display:flex;
      flex-direction:column;
      gap:16px;
      background: var(--card);
      padding:20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      max-width:1240px;
      margin:0 auto;
      border: 1px solid rgba(17,24,39,0.06);
      position:relative;
      overflow:hidden;
      animation: contentIn .18s ease-out;
    }

    @keyframes contentIn{
      from{ transform: translateY(6px); opacity:.0; }
      to{ transform: translateY(0); opacity:1; }
    }

    /* shimmer line top */
    #content:before{
      content:"";
      position:absolute;
      top:-2px; left:-60px;
      width:240px; height:4px;
      background: linear-gradient(90deg, transparent, rgba(39,37,95,.35), transparent);
      animation: shimmer 2.3s ease-in-out infinite;
      opacity:.65;
    }
    @keyframes shimmer{
      0%{ transform: translateX(-80px); }
      60%{ transform: translateX(1320px); }
      100%{ transform: translateX(1320px); }
    }

    /* ✅ Restored dropdown/input styling (original) */
    #content label{
      font-weight:900;
      margin-bottom:4px;
      display:block;
      color:#111827;
    }
    #content input,
    #content select,
    #content textarea{
      width:100%;
      padding:10px 12px;
      border:1px solid #d1d5db;
      border-radius:10px;
      font-size:14px;
      outline:none;
      transition: box-shadow .14s ease, border-color .14s ease, transform .14s ease;
      background:#fff;
    }
    #content input:focus,
    #content select:focus,
    #content textarea:focus{
      border-color: rgba(39,37,95,.45);
      box-shadow: 0 0 0 4px rgba(39,37,95,.10);
      transform: translateY(-1px);
    }

    .form-row{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
    }
    .form-row > div{ flex:1 1 200px; }

    /* Buttons */
    #content button{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      background: var(--brand);
      color:#fff;
      border: none;
      cursor:pointer;
      font-weight:900;
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
      box-shadow: 0 10px 22px rgba(39,37,95,.22);
    }
    #content button:hover{
      background: var(--brand2);
      transform: translateY(-1px);
      box-shadow: 0 14px 26px rgba(39,37,95,.26);
    }
    #content button:active{
      transform: translateY(0px) scale(.99);
    }

    /* Responsive sidebar */
    @media(max-width:980px){
      .main{ margin-left:0; padding:12px; }
      .sidebar{
        position:relative;
        width:100%;
        height:auto;
        flex-direction:row;
        align-items:center;
        flex-wrap:wrap;
        gap:10px;
      }
      .brand{ flex: 1 1 100%; }
      .nav{ flex-direction:row; flex-wrap:wrap; gap:8px; width:100%; }
      .nav-btn{ width:auto; white-space:nowrap; }
      .sidebar .footer{ flex: 1 1 100%; }
    }

    /* =========================
       INTRO OVERLAY (GIF) - first time only
    ========================= */
    .intro-overlay{
      position:fixed;
      inset:0;
      z-index:9999;
      background: radial-gradient(900px 600px at 50% 25%, rgba(255,255,255,.06), transparent 60%),
                  linear-gradient(180deg, #050814, #0f172a);
      display:flex;
      align-items:center;
      justify-content:center;
      opacity:1;
      pointer-events:auto;
      transition: opacity .25s ease;
    }
    .intro-overlay.hidden{ opacity:0; pointer-events:none; }

    .intro-gif-box{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:12px;
    }
    .intro-gif{
      width:min(720px, 92vw);
      max-height:80vh;
      height:auto;
      border-radius:16px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
    }
    .intro-caption{
      color:rgba(255,255,255,.88);
      font-weight:900;
      letter-spacing:.3px;
      text-shadow: 0 10px 22px rgba(0,0,0,.45);
    }

    /* =========================
       LOADER OVERLAY (every loading)
       blur background + loading card
    ========================= */
    .loader-overlay{
      position:fixed;
      inset:0;
      z-index:9998;
      display:flex;
      align-items:center;
      justify-content:center;
      background: rgba(15, 23, 42, .25);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity:1;
      pointer-events:auto;
      transition: opacity .2s ease;
    }
    .loader-overlay.hidden{
      opacity:0;
      pointer-events:none;
    }

    .loader-card{
      background: rgba(255,255,255,.85);
      border:1px solid rgba(17,24,39,0.10);
      box-shadow: 0 16px 40px rgba(0,0,0,.18);
      border-radius: 18px;
      padding: 18px 18px 14px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
    }
    .loader-title{
      font-weight:900;
      color:#111827;
      opacity:.85;
    }
    .loader-sub{
      font-size:12px;
      color:#6b7280;
      font-weight:800;
      margin-top:-6px;
    }

    /* tiny bounce */
    .loader-icon{
      width:80px;height:80px;
      border-radius:18px;
      background: rgba(39,37,95,.10);
      border:1px solid rgba(39,37,95,.12);
      display:grid;
      place-items:center;
      animation: bob 1.1s ease-in-out infinite;
      font-size:34px;
    }
    @keyframes bob{
      0%,100%{ transform: translateY(0); }
      50%{ transform: translateY(-6px); }
    }
  </style>
</head>

<body>
  <div class="bg-blobs">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <div class="sidebar">
    <div class="brand" aria-label="AutoLedger Pro">
      <div class="logo" title="AutoLedger Pro">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3 13.5V12.2c0-.6.36-1.14.92-1.37l1.6-.66 1.7-3.32c.28-.54.84-.88 1.45-.88h6.66c.61 0 1.17.34 1.45.88l1.7 3.32 1.6.66c.56.23.92.77.92 1.37v1.3" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M7.2 16.8h9.6" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="7.4" cy="17.3" r="1.6" stroke="white" stroke-width="1.6"/>
          <circle cx="16.6" cy="17.3" r="1.6" stroke="white" stroke-width="1.6"/>
          <path d="M5 20.2V14.8M19 20.2V14.8" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M11 9.2h6" stroke="white" stroke-width="1.6" stroke-linecap="round" opacity=".9"/>
          <path d="M11 11.4h6" stroke="white" stroke-width="1.6" stroke-linecap="round" opacity=".9"/>
        </svg>
      </div>

      <div class="brand-txt">
        <div class="name">AutoLedger Pro</div>
        <div class="tag">Car Sales • Expenses • Installments</div>
      </div>
    </div>

    <div class="nav">
      <button class="nav-btn" data-page="Dashboard" onclick="loadPage('Dashboard')">
        <span class="ic">📊</span> Dashboard
      </button>
      <button class="nav-btn" data-page="AddCar" onclick="loadPage('AddCar')">
        <span class="ic">➕</span> Add Car
      </button>
      <button class="nav-btn" data-page="AddExpense" onclick="loadPage('AddExpense')">
        <span class="ic">💲</span> Add Expense
      </button>
      <button class="nav-btn" data-page="RecordSale" onclick="loadPage('RecordSale')">
        <span class="ic">📝</span> Record Sale
      </button>
      <button class="nav-btn" data-page="InstallmentPayment" onclick="loadPage('InstallmentPayment')">
        <span class="ic">💳</span> Installment Payment
      </button>
      <button class="nav-btn" data-page="AddInvestor" onclick="loadPage('AddInvestor')">
        <span class="ic">👥</span> Add Investor
      </button>
      <button class="nav-btn" data-page="Reports" onclick="loadPage('Reports')">
        <span class="ic">📑</span> Reports
      </button>
    </div>

    <div class="footer">
      <span class="chip">✨ Designed by Shahzad Shamsi</span>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="crumb">
        <span class="dot"></span>
        <span id="crumbText">Dashboard</span>
      </div>
      <div class="actions">
        <div class="pill" onclick="loadPage('Dashboard')">Home</div>
        <div class="pill" onclick="location.reload()">Refresh</div>
      </div>
    </div>

    <div id="content">Loading...</div>
  </div>

  <!-- ✅ INTRO OVERLAY (GIF: first time only) -->
  <div id="introOverlay" class="intro-overlay hidden" aria-label="Intro">
    <div class="intro-gif-box">
      <img id="introGif" class="intro-gif" alt="Intro GIF" src="">
      <div class="intro-caption">Starting AutoLedger Pro...</div>
    </div>
  </div>

  <!-- ✅ LOADER OVERLAY (Every loading) -->
  <div id="loaderOverlay" class="loader-overlay hidden" aria-label="Loading">
    <div class="loader-card">
      <div class="loader-icon">🚗</div>
      <div class="loader-title" id="loaderText">Loading...</div>
      <div class="loader-sub">Please wait</div>
    </div>
  </div>

  <script>
    // ✅ Your Drive GIF (direct link)
    const INTRO_GIF_URL = "https://drive.google.com/uc?export=download&id=14PD-NgftTcfCO6iaYuL3zyYTkrdZ35O0";

    let CURRENT_PAGE = "";

    const introOverlay = () => document.getElementById("introOverlay");
    const introGif = () => document.getElementById("introGif");
    const loaderOverlay = () => document.getElementById("loaderOverlay");
    const loaderText = () => document.getElementById("loaderText");

    function showLoader(text){
      const o = loaderOverlay();
      if(!o) return;
      if(loaderText()) loaderText().textContent = text || "Loading...";
      o.classList.remove("hidden");
    }

    function hideLoader(){
      const o = loaderOverlay();
      if(!o) return;
      o.classList.add("hidden");
    }

    function preloadImage(url){
      return new Promise((resolve)=>{
        const img = new Image();
        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);
        img.src = url;
      });
    }

    /**
     * ✅ GIF intro (first time only)
     * GIF has no "ended" event, so we show for a fixed duration.
     * You can change INTRO_DURATION_MS if needed.
     */
    function runIntroOnce(){
      return new Promise(async (resolve)=>{
        if(sessionStorage.getItem("ALP_INTRO_DONE")){
          resolve(false);
          return;
        }
        sessionStorage.setItem("ALP_INTRO_DONE","1");

        const o = introOverlay();
        const g = introGif();
        if(!o || !g){
          resolve(false);
          return;
        }

        // force restart GIF by cache-busting
        const cacheBust = Date.now();
        g.src = INTRO_GIF_URL + "&cb=" + cacheBust;

        // try preload (best effort)
        await preloadImage(g.src);

        o.classList.remove("hidden");

        const INTRO_DURATION_MS = 7000; // ✅ 7 seconds
        setTimeout(()=>{
          o.classList.add("hidden");
          resolve(true);
        }, INTRO_DURATION_MS);
      });
    }

    function setActiveNav(page){
      document.querySelectorAll('.nav-btn').forEach(b=>{
        b.classList.toggle('active', b.getAttribute('data-page') === page);
      });
      const crumb = document.getElementById('crumbText');
      if(crumb) crumb.textContent = page;
    }

    function showLoadError(msg){
      const content = document.getElementById('content');
      content.innerHTML =
        '<div style="background:#fee2e2;color:#991b1b;padding:12px;border-radius:12px;font-weight:900;border:1px solid #fecaca;">'+
        msg +'</div>';
    }

    function setContentAndRunScripts(container, html){
      document.querySelectorAll('script[data-page-script="1"]').forEach(s => s.remove());

      container.innerHTML = html;

      const scripts = Array.from(container.querySelectorAll("script"));
      scripts.forEach(oldScript => {
        const newScript = document.createElement("script");
        newScript.setAttribute("data-page-script","1");

        if(oldScript.src){
          const already = document.querySelector('script[src="' + oldScript.src + '"]');
          if(!already){
            newScript.src = oldScript.src;
            document.head.appendChild(newScript);
          }
        } else {
          newScript.textContent = oldScript.textContent;
          document.head.appendChild(newScript);
        }
        oldScript.remove();
      });
    }

    function loadPage(page){
      CURRENT_PAGE = page;
      setActiveNav(page);

      showLoader("Loading: " + page + "...");

      const content = document.getElementById('content');
      content.innerHTML =
        '<div style="font-weight:900;color:#111827;">Loading: '+ page +'</div>'+
        '<div style="color:#6b7280;margin-top:6px;">If it stays here, server is not returning content.</div>';

      try{
        if(!window.google || !google.script || !google.script.run){
          showLoadError("google.script.run not available. Please open the Web App URL (not HTML preview).");
          hideLoader();
          return;
        }
      }catch(e){
        showLoadError("JS error before calling server: " + (e && e.message ? e.message : e));
        hideLoader();
        return;
      }

      const timer = setTimeout(()=>{
        showLoadError("Timeout while loading '"+ page +"'. Check includePage() + Apps Script Executions log.");
        hideLoader();
      }, 15000);

      const v = (new URLSearchParams(location.search).get("v")) || "";

      google.script.run
        .withSuccessHandler(html=>{
          clearTimeout(timer);

          if(!html || String(html).trim()===""){
            showLoadError("Page '"+ page +"' returned EMPTY HTML. Check file name '"+ page +".html'.");
            hideLoader();
            return;
          }

          setContentAndRunScripts(content, html);

          const initName = page + "Init";
          const initFn = window[initName];

          if(typeof initFn === 'function'){
            try{
              initFn();
            }catch(e){
              showLoadError("Init crashed ("+initName+"): " + (e && e.message ? e.message : e));
              hideLoader();
              return;
            }
          }

          hideLoader();
          window.scrollTo({top:0, behavior:'smooth'});
        })
        .withFailureHandler(err=>{
          clearTimeout(timer);
          showLoadError("Error loading '"+ page +"': " + (err && err.message ? err.message : err));
          hideLoader();
        })
        .includePage(page + (v ? ("?v="+encodeURIComponent(v)) : ""));
    }

    // ✅ STARTUP: play GIF intro (first time), then open portal
    (async function boot(){
      await runIntroOnce();
      loadPage('Dashboard');
    })();

    // ✅ For testing intro again:
    // sessionStorage.removeItem("ALP_INTRO_DONE"); location.reload();
  </script>
</body>
</html>
